    <circle cx="0" cy="-30" r="50" fill="none" stroke="#4a90e2" stroke-width="3" opacity="0.6"/>
    <circle cx="0" cy="-30" r="14" fill="none" stroke="#50c878" stroke-width="3"/>
    <!-- Arrow right -->
    <path d="M50 -30 L70 -30 L65 -38 M70 -30 L65 -22" stroke="#50c878" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- PR icon -->
    <path d="M90 -10 L90 10 L110 10 L110 -10 Z" fill="none" stroke="#4a90e2" stroke-width="2.5" rx="2"/>
    <circle cx="90" cy="-15" r="5" fill="#50c878"/>
    <circle cx="110" cy="-15" r="5" fill="#50c878"/>
    <!-- Workflow pipeline dots -->
    <circle cx="-40" cy="45" r="6" fill="#4a90e2" opacity="0.6"/>
    <circle cx="-10" cy="45" r="6" fill="#4a90e2" opacity="0.75"/>
    <circle cx="20" cy="45" r="6" fill="#50c878" opacity="0.6"/>
    <circle cx="50" cy="45" r="6" fill="#50c878" opacity="0.75"/>
    <circle cx="80" cy="45" r="6" fill="#e2a64a" opacity="0.6"/>
    <line x1="-34" y1="45" x2="-16" y2="45" stroke="#4a90e2" stroke-width="1.5" opacity="0.4"/>
    <line x1="-4" y1="45" x2="14" y2="45" stroke="#50c878" stroke-width="1.5" opacity="0.4"/>
    <line x1="26" y1="45" x2="44" y2="45" stroke="#50c878" stroke-width="1.5" opacity="0.4"/>
    <line x1="56" y1="45" x2="74" y2="45" stroke="#e2a64a" stroke-width="1.5" opacity="0.4"/>
    <text x="0" y="90" text-anchor="middle" fill="#526170" font-family="monospace" font-size="24" opacity="0.7">IssuePilot · Multi-Agent Pipeline</text>
